services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer-service-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:7289:7289"
    environment:
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=customer_service;Username=customer_service;Password=${POSTGRES_PASSWORD:-customer-service-dev}"
    volumes:
      - ./backend/src/CustomerService.Api:/app/src/CustomerService.Api
      - ./.certs:/certs:ro
      # Keep Linux build output in the container, not mixed with the host's bin/obj.
      - /app/src/CustomerService.Api/bin
      - /app/src/CustomerService.Api/obj
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/7289'"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      DEV_HTTPS: "true"
      DEV_CERT_DIR: /certs
      # Vite proxies /api to this address (see vite.config.ts).
      API_PROXY_TARGET: https://backend:7289
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - ./.certs:/certs:ro
      # Keep Linux-built node_modules in the container.
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://127.0.0.1:5173', { rejectUnauthorized: false }, res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      DEV_HTTPS: "true"
      PLAYWRIGHT_BASE_URL: https://frontend:5173
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
